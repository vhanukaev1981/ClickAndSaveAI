name: Android and Backend CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: functions

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install backend dependencies
        run: npm install --ignore-scripts

      - name: Run backend tests
        run: npm test

  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify staging OAuth isolation
        shell: bash
        run: |
          STAGING_CLIENT_ID='716864421960-hnt5709tqk9qp79si8ggplf5jif1ulfu.apps.googleusercontent.com'
          if grep -R --fixed-strings "$STAGING_CLIENT_ID" app/src/main; then
            echo 'Staging OAuth client ID must not exist in main/release Android resources.' >&2
            exit 1
          fi
          grep -q --fixed-strings "$STAGING_CLIENT_ID" app/src/debug/res/values/strings.xml

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest --stacktrace

      - name: Run lint
        run: gradle --no-daemon lintDebug --stacktrace

      - name: Assemble debug APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Upload staging debug APK
        uses: actions/upload-artifact@v4
        with:
          name: clickandsaveai-staging-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Assemble release APK
        run: gradle --no-daemon assembleRelease --stacktrace
