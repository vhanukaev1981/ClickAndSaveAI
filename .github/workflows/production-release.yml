name: Production Release Gate

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character source SHA to release
        required: true
        type: string
      confirm_environment:
        description: Type CLICKANDSAVEAI_PRODUCTION
        required: true
        type: string
      authorize_firebase_deploy:
        description: Type DEPLOY_FIREBASE_PRODUCTION only when a separately authorized Firebase deployment is intended
        required: true
        default: NO_DEPLOY
        type: string
      authorize_wif_auth_proof:
        description: Type PROVE_WIF_AUTH_ONLY only when a separately authorized WIF auth-only proof is intended
        required: true
        default: NO_WIF_PROOF
        type: string
      authorize_3f_metadata_probe:
        description: Type PROBE_3F_METADATA_ONLY only when a separately authorized Block 3F metadata-only probe is intended
        required: true
        default: NO_3F_PROBE
        type: string

concurrency:
  group: clickandsaveai-production-release
  cancel-in-progress: false

jobs:
  production-candidate:
    if: ${{ inputs.authorize_wif_auth_proof != 'PROVE_WIF_AUTH_ONLY' && inputs.authorize_3f_metadata_probe != 'PROBE_3F_METADATA_ONLY' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      PRODUCTION_FIREBASE_PROJECT_ID: ${{ vars.PRODUCTION_FIREBASE_PROJECT_ID }}
      PRODUCTION_GOOGLE_WEB_CLIENT_ID: ${{ vars.PRODUCTION_GOOGLE_WEB_CLIENT_ID }}
      PRODUCTION_APP_SIGNING_CERT_SHA1: ${{ vars.PRODUCTION_APP_SIGNING_CERT_SHA1 }}
      PRODUCTION_APP_SIGNING_CERT_SHA256: ${{ vars.PRODUCTION_APP_SIGNING_CERT_SHA256 }}
      PRODUCTION_UPLOAD_KEY_ALIAS: ${{ vars.PRODUCTION_UPLOAD_KEY_ALIAS }}
      PRODUCTION_GOOGLE_SERVICES_JSON_B64: ${{ secrets.PRODUCTION_GOOGLE_SERVICES_JSON_B64 }}
      PRODUCTION_UPLOAD_KEYSTORE_B64: ${{ secrets.PRODUCTION_UPLOAD_KEYSTORE_B64 }}
      PRODUCTION_UPLOAD_STORE_PASSWORD: ${{ secrets.PRODUCTION_UPLOAD_STORE_PASSWORD }}
      PRODUCTION_UPLOAD_KEY_PASSWORD: ${{ secrets.PRODUCTION_UPLOAD_KEY_PASSWORD }}

    steps:
      - name: Guard explicit production authorization and inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ inputs.confirm_environment }}' == 'CLICKANDSAVEAI_PRODUCTION' ]] || { echo 'Production confirmation phrase mismatch.' >&2; exit 1; }
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'source_sha must be an exact lowercase 40-character commit SHA.' >&2; exit 1; }
          missing=()
          for name in PRODUCTION_FIREBASE_PROJECT_ID PRODUCTION_GOOGLE_WEB_CLIENT_ID PRODUCTION_APP_SIGNING_CERT_SHA1 PRODUCTION_APP_SIGNING_CERT_SHA256 PRODUCTION_UPLOAD_KEY_ALIAS PRODUCTION_GOOGLE_SERVICES_JSON_B64 PRODUCTION_UPLOAD_KEYSTORE_B64 PRODUCTION_UPLOAD_STORE_PASSWORD PRODUCTION_UPLOAD_KEY_PASSWORD; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing production environment inputs:' >&2
            printf ' %s' "${missing[@]}" >&2
            printf '\n' >&2
            exit 1
          fi
          [[ "$PRODUCTION_FIREBASE_PROJECT_ID" != 'clickandsaveai-staging' ]] || { echo 'Production project cannot equal staging.' >&2; exit 1; }

      - name: Check out exact production source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify exact source and P0 lineage
        shell: bash
        run: |
          set -euo pipefail
          P0_SHA='6a3a3ac2dcbeef16260cb8d7456568a41c80fa01'
          ACTUAL_SHA="$(git rev-parse HEAD)"
          [[ "$ACTUAL_SHA" == "$SOURCE_SHA" ]] || { echo "Checked out $ACTUAL_SHA instead of $SOURCE_SHA" >&2; exit 1; }
          git merge-base --is-ancestor "$P0_SHA" "$ACTUAL_SHA" || { echo 'Source is not descended from the frozen P0 checkpoint.' >&2; exit 1; }

      - name: Require final CI success on exact source SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUNS="$(gh api --method GET "/repos/$GITHUB_REPOSITORY/actions/workflows/android-ci.yml/runs?head_sha=$SOURCE_SHA&status=completed&per_page=20")"
          RUN_NUMBER="$(printf '%s' "$RUNS" | jq -r '[.workflow_runs[] | select(.conclusion == "success")][0].run_number // ""')"
          [[ -n "$RUN_NUMBER" ]] || { echo "No successful final CI exists for exact SHA $SOURCE_SHA." >&2; exit 1; }
          echo "FINAL_CI_RUN_NUMBER=$RUN_NUMBER" >> "$GITHUB_ENV"
          echo "Verified final CI #$RUN_NUMBER for exact source SHA."

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Run repository and history security gates
        shell: bash
        run: |
          set -euo pipefail
          SECRET_AUDIT_OUTPUT="$RUNNER_TEMP/secret-current.json" node scripts/repository-secret-audit.mjs current
          SECRET_AUDIT_OUTPUT="$RUNNER_TEMP/secret-history.json" node scripts/repository-secret-audit.mjs history
          node scripts/production-readiness-guard.mjs repository

      - name: Materialize production configuration without logging credentials
        shell: bash
        run: |
          set -euo pipefail
          rm -f app/google-services.json app/src/release/google-services.json
          mkdir -p app/src/release
          GOOGLE_CONFIG="$RUNNER_TEMP/google-services-production.json"
          UPLOAD_KEYSTORE="$RUNNER_TEMP/clickandsaveai-production-upload.jks"
          printf '%s' "$PRODUCTION_GOOGLE_SERVICES_JSON_B64" | base64 --decode > "$GOOGLE_CONFIG"
          printf '%s' "$PRODUCTION_UPLOAD_KEYSTORE_B64" | base64 --decode > "$UPLOAD_KEYSTORE"
          chmod 600 "$GOOGLE_CONFIG" "$UPLOAD_KEYSTORE"
          cp "$GOOGLE_CONFIG" app/src/release/google-services.json
          echo "PRODUCTION_GOOGLE_SERVICES_JSON_PATH=$GOOGLE_CONFIG" >> "$GITHUB_ENV"
          echo "PRODUCTION_UPLOAD_KEYSTORE_PATH=$UPLOAD_KEYSTORE" >> "$GITHUB_ENV"
          echo 'PRODUCTION_RELEASE_CANDIDATE=true' >> "$GITHUB_ENV"

      - name: Verify production configuration isolation
        run: node scripts/production-readiness-guard.mjs materialized

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Re-run backend regression and dependency severity gate
        working-directory: functions
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts
          npm test
          npm audit --omit=dev --audit-level=high

      - name: Re-run Android regression and lint
        run: gradle --no-daemon testDebugUnitTest lintDebug --stacktrace

      - name: Build signed production candidate APK and AAB
        run: gradle --no-daemon assembleRelease bundleRelease --stacktrace

      - name: Verify signing identities and record exact-SHA traceability
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          AAB="$(find app/build/outputs/bundle/release -maxdepth 1 -name '*.aab' -print -quit)"
          [[ -n "$APK" && -n "$AAB" ]] || { echo 'Signed release APK/AAB not found.' >&2; exit 1; }

          APK_CERT_OUTPUT="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK")"
          UPLOAD_CERT_SHA256="$(printf '%s\n' "$APK_CERT_OUTPUT" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          [[ "$UPLOAD_CERT_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo 'Unable to identify upload signing certificate.' >&2; exit 1; }

          AAB_CERT_OUTPUT="$(keytool -printcert -jarfile "$AAB")"
          AAB_CERT_SHA256="$(printf '%s\n' "$AAB_CERT_OUTPUT" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          [[ "$AAB_CERT_SHA256" == "$UPLOAD_CERT_SHA256" ]] || { echo 'APK and AAB upload signing identities differ.' >&2; exit 1; }

          PLAY_CERT_SHA1="$(printf '%s' "$PRODUCTION_APP_SIGNING_CERT_SHA1" | tr '[:lower:]' '[:upper:]' | tr -d ':')"
          [[ "$PLAY_CERT_SHA1" =~ ^[0-9A-F]{40}$ ]] || { echo 'PRODUCTION_APP_SIGNING_CERT_SHA1 must be a SHA-1 certificate fingerprint.' >&2; exit 1; }
          PLAY_CERT_SHA256="$(printf '%s' "$PRODUCTION_APP_SIGNING_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          [[ "$PLAY_CERT_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo 'PRODUCTION_APP_SIGNING_CERT_SHA256 must be a SHA-256 certificate fingerprint.' >&2; exit 1; }
          [[ "$UPLOAD_CERT_SHA256" != "$PLAY_CERT_SHA256" ]] || { echo 'Upload key must be distinct from the Google Play app signing key.' >&2; exit 1; }

          VERSION_CODE="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)"
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          OUT="$RUNNER_TEMP/production-candidate"
          mkdir -p "$OUT"
          cp "$APK" "$AAB" "$OUT/"
          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          AAB_SHA256="$(sha256sum "$AAB" | awk '{print $1}')"
          cat > "$OUT/identity.txt" <<EOF
          source_sha=$SOURCE_SHA
          ci_run_number=$FINAL_CI_RUN_NUMBER
          production_gate_run_id=$GITHUB_RUN_ID
          production_gate_run_number=$GITHUB_RUN_NUMBER
          application_id=com.aistudio.clickandsaveai.app
          version_code=$VERSION_CODE
          version_name=$VERSION_NAME
          firebase_project_id=$PRODUCTION_FIREBASE_PROJECT_ID
          apk_file=$(basename "$APK")
          apk_sha256=$APK_SHA256
          aab_file=$(basename "$AAB")
          aab_sha256=$AAB_SHA256
          upload_signing_cert_sha256=$UPLOAD_CERT_SHA256
          play_app_signing_cert_sha1=$PLAY_CERT_SHA1
          play_app_signing_cert_sha256=$PLAY_CERT_SHA256
          release_approved=false
          firebase_deployed=false
          google_play_published=false
          EOF

      - name: Upload signed production candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: clickandsaveai-production-candidate-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/production-candidate
          if-no-files-found: error
          retention-days: 14

      - name: Remove materialized production credential files
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f app/src/release/google-services.json "$PRODUCTION_GOOGLE_SERVICES_JSON_PATH" "$PRODUCTION_UPLOAD_KEYSTORE_PATH"

  production-wif-auth-proof:
    if: ${{ inputs.authorize_3f_metadata_probe != 'PROBE_3F_METADATA_ONLY' && inputs.authorize_wif_auth_proof == 'PROVE_WIF_AUTH_ONLY' && inputs.authorize_firebase_deploy == 'NO_DEPLOY' && inputs.confirm_environment == 'CLICKANDSAVEAI_PRODUCTION' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      EXPECTED_REPOSITORY: vhanukaev1981/ClickAndSaveAI
      EXPECTED_REPOSITORY_ID: '1314210715'
      EXPECTED_REPOSITORY_OWNER_ID: '64756523'
      EXPECTED_ENVIRONMENT: production
      EXPECTED_REF: refs/heads/main
      EXPECTED_WORKFLOW_REF: vhanukaev1981/ClickAndSaveAI/.github/workflows/production-release.yml@refs/heads/main
      EXPECTED_PROJECT_ID: click-save-ai-production
      EXPECTED_PROJECT_NUMBER: '991489557172'
      EXPECTED_DEPLOY_SA: clickandsaveai-github-deployer@click-save-ai-production.iam.gserviceaccount.com

    steps:
      - name: Guard exact WIF auth-only boundary
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ inputs.authorize_wif_auth_proof }}' == 'PROVE_WIF_AUTH_ONLY' ]] || { echo 'WIF auth-only authorization phrase mismatch.' >&2; exit 1; }
          [[ '${{ inputs.authorize_firebase_deploy }}' == 'NO_DEPLOY' ]] || { echo 'WIF auth-only mode requires the deployment gate to remain closed.' >&2; exit 1; }
          [[ '${{ inputs.confirm_environment }}' == 'CLICKANDSAVEAI_PRODUCTION' ]] || { echo 'Production confirmation phrase mismatch.' >&2; exit 1; }
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'source_sha must be an exact lowercase 40-character commit SHA.' >&2; exit 1; }
          [[ '${{ github.sha }}' == "$SOURCE_SHA" ]] || { echo 'WIF auth-only source must equal the workflow main HEAD.' >&2; exit 1; }
          [[ '${{ github.repository }}' == "$EXPECTED_REPOSITORY" ]] || { echo 'Repository identity mismatch.' >&2; exit 1; }
          [[ '${{ github.repository_id }}' == "$EXPECTED_REPOSITORY_ID" ]] || { echo 'Repository ID mismatch.' >&2; exit 1; }
          [[ '${{ github.repository_owner_id }}' == "$EXPECTED_REPOSITORY_OWNER_ID" ]] || { echo 'Repository owner ID mismatch.' >&2; exit 1; }
          [[ '${{ github.ref }}' == "$EXPECTED_REF" ]] || { echo 'Git ref mismatch.' >&2; exit 1; }
          [[ '${{ github.workflow_ref }}' == "$EXPECTED_WORKFLOW_REF" ]] || { echo 'Workflow ref mismatch.' >&2; exit 1; }
          [[ "$EXPECTED_ENVIRONMENT" == 'production' ]] || { echo 'Environment boundary mismatch.' >&2; exit 1; }
          [[ -n "$GCP_WORKLOAD_IDENTITY_PROVIDER" ]] || { echo 'Required WIF provider variable is unavailable.' >&2; exit 1; }
          [[ -n "$GCP_DEPLOY_SERVICE_ACCOUNT" ]] || { echo 'Required deploy service-account variable is unavailable.' >&2; exit 1; }
          [[ "$GCP_DEPLOY_SERVICE_ACCOUNT" == "$EXPECTED_DEPLOY_SA" ]] || { echo 'Deploy service-account identity mismatch.' >&2; exit 1; }
          [[ "$GCP_WORKLOAD_IDENTITY_PROVIDER" =~ ^projects/${EXPECTED_PROJECT_NUMBER}/locations/global/workloadIdentityPools/[^/]+/providers/[^/]+$ ]] || { echo 'WIF provider project-number boundary mismatch.' >&2; exit 1; }

      - name: Check out exact WIF proof source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Authenticate WIF auth-only identity
        id: auth
        uses: google-github-actions/auth@v3
        with:
          create_credentials_file: 'true'
          cleanup_credentials: 'true'
          export_environment_variables: 'false'
          project_id: ${{ env.EXPECTED_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Verify external-account credentials and emit sanitized identity metadata
        env:
          AUTH_PROJECT_ID: ${{ steps.auth.outputs.project_id }}
          CREDENTIALS_FILE: ${{ steps.auth.outputs.credentials_file_path }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$AUTH_PROJECT_ID" == "$EXPECTED_PROJECT_ID" ]] || { echo 'Authenticated project ID mismatch.' >&2; exit 1; }
          [[ -n "$CREDENTIALS_FILE" && -f "$CREDENTIALS_FILE" ]] || { echo 'External-account credentials file was not created.' >&2; exit 1; }

          CREDENTIAL_TYPE="$(jq -r '.type // empty' "$CREDENTIALS_FILE")"
          [[ "$CREDENTIAL_TYPE" == 'external_account' ]] || { echo 'Credential type is not external_account.' >&2; exit 1; }
          if jq -e '.type == "service_account" or has("private_key") or has("private_key_id")' "$CREDENTIALS_FILE" >/dev/null; then
            echo 'Long-lived service-account key material is forbidden.' >&2
            exit 1
          fi

          AUDIENCE="$(jq -r '.audience // empty' "$CREDENTIALS_FILE")"
          IMPERSONATION_URL="$(jq -r '.service_account_impersonation_url // empty' "$CREDENTIALS_FILE")"
          [[ "$AUDIENCE" =~ /projects/${EXPECTED_PROJECT_NUMBER}/locations/global/workloadIdentityPools/[^/]+/providers/[^/]+$ ]] || { echo 'Credential audience project-number boundary mismatch.' >&2; exit 1; }
          EXPECTED_DEPLOY_SA_ENCODED="${EXPECTED_DEPLOY_SA//@/%40}"
          [[ "$IMPERSONATION_URL" == *"/serviceAccounts/$EXPECTED_DEPLOY_SA:generateAccessToken" || "$IMPERSONATION_URL" == *"/serviceAccounts/$EXPECTED_DEPLOY_SA_ENCODED:generateAccessToken" ]] || { echo 'Credential impersonation identity mismatch.' >&2; exit 1; }

          printf '%s\n' \
            'wif_auth=verified' \
            "repository=$EXPECTED_REPOSITORY" \
            "repository_id=$EXPECTED_REPOSITORY_ID" \
            "repository_owner_id=$EXPECTED_REPOSITORY_OWNER_ID" \
            "environment=$EXPECTED_ENVIRONMENT" \
            "ref=$EXPECTED_REF" \
            "workflow_ref=$EXPECTED_WORKFLOW_REF" \
            "project_id=$EXPECTED_PROJECT_ID" \
            "project_number=$EXPECTED_PROJECT_NUMBER" \
            "service_account=$EXPECTED_DEPLOY_SA" \
            'credential_type=external_account'

  production-3f-metadata-probe:
    if: ${{ inputs.authorize_3f_metadata_probe == 'PROBE_3F_METADATA_ONLY' && inputs.authorize_firebase_deploy == 'NO_DEPLOY' && inputs.authorize_wif_auth_proof == 'NO_WIF_PROOF' && inputs.confirm_environment == 'CLICKANDSAVEAI_PRODUCTION' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      EXPECTED_REPOSITORY: vhanukaev1981/ClickAndSaveAI
      EXPECTED_REPOSITORY_ID: '1314210715'
      EXPECTED_REPOSITORY_OWNER_ID: '64756523'
      EXPECTED_REF: refs/heads/main
      EXPECTED_WORKFLOW_REF: vhanukaev1981/ClickAndSaveAI/.github/workflows/production-release.yml@refs/heads/main
      PRODUCTION_FIREBASE_PROJECT_ID: ${{ vars.PRODUCTION_FIREBASE_PROJECT_ID }}
      PRODUCTION_GOOGLE_WEB_CLIENT_ID: ${{ vars.PRODUCTION_GOOGLE_WEB_CLIENT_ID }}
      PRODUCTION_APP_SIGNING_CERT_SHA1: ${{ vars.PRODUCTION_APP_SIGNING_CERT_SHA1 }}
      PRODUCTION_APP_SIGNING_CERT_SHA256: ${{ vars.PRODUCTION_APP_SIGNING_CERT_SHA256 }}
      PRODUCTION_UPLOAD_KEY_ALIAS: ${{ vars.PRODUCTION_UPLOAD_KEY_ALIAS }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      PRODUCTION_GOOGLE_SERVICES_JSON_B64: ${{ secrets.PRODUCTION_GOOGLE_SERVICES_JSON_B64 }}
      PRODUCTION_UPLOAD_KEYSTORE_B64: ${{ secrets.PRODUCTION_UPLOAD_KEYSTORE_B64 }}
      PRODUCTION_UPLOAD_STORE_PASSWORD: ${{ secrets.PRODUCTION_UPLOAD_STORE_PASSWORD }}
      PRODUCTION_UPLOAD_KEY_PASSWORD: ${{ secrets.PRODUCTION_UPLOAD_KEY_PASSWORD }}

    steps:
      - name: Guard exact Block 3F metadata-only boundary
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ inputs.authorize_3f_metadata_probe }}' == 'PROBE_3F_METADATA_ONLY' ]] || { echo 'Block 3F metadata-probe authorization phrase mismatch.' >&2; exit 1; }
          [[ '${{ inputs.authorize_firebase_deploy }}' == 'NO_DEPLOY' ]] || { echo 'Block 3F metadata-probe mode requires authorize_firebase_deploy=NO_DEPLOY.' >&2; exit 1; }
          [[ '${{ inputs.authorize_wif_auth_proof }}' == 'NO_WIF_PROOF' ]] || { echo 'Block 3F metadata-probe mode requires authorize_wif_auth_proof=NO_WIF_PROOF.' >&2; exit 1; }
          [[ '${{ inputs.confirm_environment }}' == 'CLICKANDSAVEAI_PRODUCTION' ]] || { echo 'Production confirmation phrase mismatch.' >&2; exit 1; }
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'source_sha must be an exact lowercase 40-character commit SHA.' >&2; exit 1; }
          [[ '${{ github.sha }}' == "$SOURCE_SHA" ]] || { echo 'Block 3F metadata probe source must equal the workflow main HEAD.' >&2; exit 1; }
          [[ '${{ github.repository }}' == "$EXPECTED_REPOSITORY" ]] || { echo 'Repository identity mismatch.' >&2; exit 1; }
          [[ '${{ github.repository_id }}' == "$EXPECTED_REPOSITORY_ID" ]] || { echo 'Repository ID mismatch.' >&2; exit 1; }
          [[ '${{ github.repository_owner_id }}' == "$EXPECTED_REPOSITORY_OWNER_ID" ]] || { echo 'Repository owner ID mismatch.' >&2; exit 1; }
          [[ '${{ github.ref }}' == "$EXPECTED_REF" ]] || { echo 'Git ref mismatch.' >&2; exit 1; }
          [[ '${{ github.workflow_ref }}' == "$EXPECTED_WORKFLOW_REF" ]] || { echo 'Workflow ref mismatch.' >&2; exit 1; }

      - name: Check out exact Block 3F probe source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js 22 for metadata validation
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Set up JDK 21 for public certificate metadata
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Materialize protected blobs to runner temp only
        env:
          BLOCK3F_GOOGLE_CONFIG_PATH: ${{ runner.temp }}/block3f-google-services.json
          BLOCK3F_UPLOAD_KEYSTORE_PATH: ${{ runner.temp }}/block3f-upload-keystore
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          rm -f "$BLOCK3F_GOOGLE_CONFIG_PATH" "$BLOCK3F_UPLOAD_KEYSTORE_PATH"
          if [[ -n "$PRODUCTION_GOOGLE_SERVICES_JSON_B64" ]]; then
            printf '%s' "$PRODUCTION_GOOGLE_SERVICES_JSON_B64" | base64 --decode > "$BLOCK3F_GOOGLE_CONFIG_PATH"
          fi
          if [[ -n "$PRODUCTION_UPLOAD_KEYSTORE_B64" ]]; then
            printf '%s' "$PRODUCTION_UPLOAD_KEYSTORE_B64" | base64 --decode > "$BLOCK3F_UPLOAD_KEYSTORE_PATH"
          fi
          echo "BLOCK3F_GOOGLE_CONFIG_PATH=$BLOCK3F_GOOGLE_CONFIG_PATH" >> "$GITHUB_ENV"
          echo "BLOCK3F_UPLOAD_KEYSTORE_PATH=$BLOCK3F_UPLOAD_KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Extract upload certificate metadata without exposing keystore material
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$PRODUCTION_UPLOAD_KEYSTORE_B64" && -n "$PRODUCTION_UPLOAD_STORE_PASSWORD" && -n "$PRODUCTION_UPLOAD_KEY_ALIAS" ]]; then
            CERT_OUTPUT="$(keytool -list -v -keystore "$BLOCK3F_UPLOAD_KEYSTORE_PATH" -storepass:env PRODUCTION_UPLOAD_STORE_PASSWORD -alias "$PRODUCTION_UPLOAD_KEY_ALIAS" 2>/dev/null)" || { echo 'Upload keystore metadata read failed.' >&2; exit 1; }
            UPLOAD_CERT_SHA1="$(printf '%s\n' "$CERT_OUTPUT" | sed -n 's/^[[:space:]]*SHA1: //p' | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
            UPLOAD_CERT_SHA256="$(printf '%s\n' "$CERT_OUTPUT" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
            [[ "$UPLOAD_CERT_SHA1" =~ ^[0-9a-f]{40}$ ]] || { echo 'Upload certificate SHA-1 metadata is unavailable.' >&2; exit 1; }
            [[ "$UPLOAD_CERT_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo 'Upload certificate SHA-256 metadata is unavailable.' >&2; exit 1; }
            echo "PRODUCTION_UPLOAD_CERT_SHA1=$UPLOAD_CERT_SHA1" >> "$GITHUB_ENV"
            echo "PRODUCTION_UPLOAD_CERT_SHA256=$UPLOAD_CERT_SHA256" >> "$GITHUB_ENV"
          fi

      - name: Validate secret-safe Production metadata relationships
        run: node scripts/production-3f-metadata-probe.mjs

      - name: Remove Block 3F temporary decoded files
        if: ${{ always() }}
        env:
          BLOCK3F_GOOGLE_CONFIG_PATH: ${{ runner.temp }}/block3f-google-services.json
          BLOCK3F_UPLOAD_KEYSTORE_PATH: ${{ runner.temp }}/block3f-upload-keystore
        shell: bash
        run: |
          rm -f "$BLOCK3F_GOOGLE_CONFIG_PATH" "$BLOCK3F_UPLOAD_KEYSTORE_PATH"

  deploy-firebase-production:
    needs: production-candidate
    if: ${{ inputs.authorize_3f_metadata_probe != 'PROBE_3F_METADATA_ONLY' && inputs.authorize_wif_auth_proof != 'PROVE_WIF_AUTH_ONLY' && inputs.authorize_firebase_deploy == 'DEPLOY_FIREBASE_PRODUCTION' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      PRODUCTION_FIREBASE_PROJECT_ID: ${{ vars.PRODUCTION_FIREBASE_PROJECT_ID }}

    steps:
      - name: Check out exact approved candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Re-guard production deployment target
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ inputs.confirm_environment }}' == 'CLICKANDSAVEAI_PRODUCTION' ]] || exit 1
          [[ -n "$PRODUCTION_FIREBASE_PROJECT_ID" ]] || { echo 'PRODUCTION_FIREBASE_PROJECT_ID is missing.' >&2; exit 1; }
          [[ "$PRODUCTION_FIREBASE_PROJECT_ID" != 'clickandsaveai-staging' ]] || { echo 'Refusing production deployment to staging project.' >&2; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]] || exit 1

      - name: Authenticate production deploy identity with GitHub OIDC
        uses: google-github-actions/auth@v3
        with:
          create_credentials_file: 'true'
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install backend dependencies and Firebase CLI
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix functions install --ignore-scripts
          npm install --global firebase-tools@15.24.0

      - name: Re-run backend tests immediately before deploy
        run: npm --prefix functions test

      - name: Deploy Firebase production only after explicit authorization
        shell: bash
        run: |
          set -euo pipefail
          firebase deploy \
            --project "$PRODUCTION_FIREBASE_PROJECT_ID" \
            --only firestore:rules,firestore:indexes,functions \
            --non-interactive