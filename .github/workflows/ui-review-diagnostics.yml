name: UI Review Diagnostics

on:
  push:
    branches:
      - review/ui-truthfulness-current

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STAGING_GOOGLE_SERVICES_JSON_B64: ${{ secrets.STAGING_GOOGLE_SERVICES_JSON_B64 }}
    steps:
      - uses: actions/checkout@v6

      - name: Restore staging Firebase config
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$STAGING_GOOGLE_SERVICES_JSON_B64" ]]; then
            echo 'STAGING_GOOGLE_SERVICES_JSON_B64 is required for diagnostics.' >&2
            exit 1
          fi
          printf '%s' "$STAGING_GOOGLE_SERVICES_JSON_B64" | base64 --decode > app/google-services.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Run Android unit tests with diagnostics
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon testDebugUnitTest --stacktrace --info 2>&1 | tee /tmp/gradle-test.log

      - name: Emit compile and Gradle failures
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('/tmp/gradle-test.log')
          if not path.exists():
              print('::warning::Gradle diagnostic log was not produced.')
              raise SystemExit(0)
          lines = path.read_text(errors='replace').splitlines()
          patterns = (
              re.compile(r'(^|\s)e:\s+file:///(.+?):(\d+):(\d+)\s+(.+)$'),
              re.compile(r'(^|\s)(.+?\.kt):(\d+):(\d+):\s+error:\s+(.+)$', re.I),
          )
          emitted = 0
          for line in lines:
              for pattern in patterns:
                  m = pattern.search(line)
                  if not m:
                      continue
                  groups = m.groups()
                  if len(groups) == 5 and 'file:///' in line:
                      _, file_path, line_no, col_no, message = groups
                  else:
                      _, file_path, line_no, col_no, message = groups
                  file_path = file_path.replace('%20', ' ')
                  print(f'::error file={file_path},line={line_no},col={col_no}::{message[:1500]}')
                  emitted += 1
                  break
          if emitted == 0:
              interesting = [
                  line.strip() for line in lines
                  if ('FAILURE:' in line or 'Compilation error' in line or 'Execution failed for task' in line)
              ]
              if interesting:
                  print('::error::' + ' | '.join(interesting[-8:])[:3000])
              else:
                  print('::warning::No compile error pattern found in Gradle output.')
          PY

      - name: Emit failing JUnit assertions
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          roots = list(Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'))
          if not roots:
              print('::warning::No JUnit XML files were produced.')
          for path in roots:
              try:
                  root = ET.parse(path).getroot()
              except Exception as exc:
                  print(f'::warning file={path}::Could not parse JUnit XML: {exc}')
                  continue
              for case in root.findall('.//testcase'):
                  failure = case.find('failure')
                  error = case.find('error')
                  node = failure if failure is not None else error
                  if node is None:
                      continue
                  cls = case.attrib.get('classname', '')
                  name = case.attrib.get('name', '')
                  message = (node.attrib.get('message') or (node.text or '')).strip().replace('\n', ' ')[:1500]
                  print(f'::error file={path}::{cls}.{name}: {message}')
          PY

      - name: Upload unit-test reports and Gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-review-unit-test-reports-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 2
          path: |
            /tmp/gradle-test.log
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**

      - name: Fail if unit tests failed
        if: steps.tests.outcome != 'success'
        run: exit 1
