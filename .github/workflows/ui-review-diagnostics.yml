name: UI Review Diagnostics

on:
  push:
    branches:
      - review/ui-truthfulness-current

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.3.1'
      - name: Run Android unit tests with diagnostics
        id: tests
        continue-on-error: true
        run: gradle testDebugUnitTest --stacktrace --info
      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-review-unit-test-reports-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 2
          path: |
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
      - name: Fail if unit tests failed
        if: steps.tests.outcome != 'success'
        run: exit 1
