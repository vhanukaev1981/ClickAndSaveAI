name: Firebase Production Health Controller

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact lowercase 40-character main SHA to verify
        required: true
        type: string
      deployment_run_id:
        description: Production Release Gate run ID containing the successful Firebase deployment
        required: true
        type: string
      authorize_firebase_health_check:
        description: Type VERIFY_FIREBASE_PRODUCTION_HEALTH to run the bounded post-deploy health check
        required: true
        default: NO_FIREBASE_HEALTH_CHECK
        type: string

concurrency:
  group: firebase-production-health-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  verify-firebase-production-health:
    if: ${{ inputs.authorize_firebase_health_check == 'VERIFY_FIREBASE_PRODUCTION_HEALTH' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      DEPLOYMENT_RUN_ID: ${{ inputs.deployment_run_id }}
      EXPECTED_REPOSITORY: vhanukaev1981/ClickAndSaveAI
      EXPECTED_REPOSITORY_ID: '1314210715'
      EXPECTED_REPOSITORY_OWNER_ID: '64756523'
      EXPECTED_REF: refs/heads/main
      EXPECTED_WORKFLOW_REF: vhanukaev1981/ClickAndSaveAI/.github/workflows/firebase-production-health-controller.yml@refs/heads/main
      EXPECTED_PROJECT_ID: click-save-ai-production
      EXPECTED_PROJECT_NUMBER: '991489557172'
      EXPECTED_PACKAGE: com.aistudio.clickandsaveai.app
      EXPECTED_DEPLOY_SA: clickandsaveai-github-deployer@click-save-ai-production.iam.gserviceaccount.com
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/991489557172/locations/global/workloadIdentityPools/github-actions-firebase-health/providers/clickandsaveai-firebase-health
      GCP_DEPLOY_SERVICE_ACCOUNT: clickandsaveai-github-deployer@click-save-ai-production.iam.gserviceaccount.com

    steps:
      - name: Guard exact Firebase health boundary
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ inputs.authorize_firebase_health_check }}' == 'VERIFY_FIREBASE_PRODUCTION_HEALTH' ]] || { echo 'Firebase health authorization phrase mismatch.' >&2; exit 1; }
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'source_sha must be an exact lowercase 40-character commit SHA.' >&2; exit 1; }
          [[ "$DEPLOYMENT_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'deployment_run_id must be numeric.' >&2; exit 1; }
          [[ '${{ github.sha }}' == "$SOURCE_SHA" ]] || { echo 'Firebase health source must equal current main HEAD.' >&2; exit 1; }
          [[ '${{ github.repository }}' == "$EXPECTED_REPOSITORY" ]] || { echo 'Repository identity mismatch.' >&2; exit 1; }
          [[ '${{ github.repository_id }}' == "$EXPECTED_REPOSITORY_ID" ]] || { echo 'Repository ID mismatch.' >&2; exit 1; }
          [[ '${{ github.repository_owner_id }}' == "$EXPECTED_REPOSITORY_OWNER_ID" ]] || { echo 'Repository owner ID mismatch.' >&2; exit 1; }
          [[ '${{ github.ref }}' == "$EXPECTED_REF" ]] || { echo 'Git ref mismatch.' >&2; exit 1; }
          [[ '${{ github.workflow_ref }}' == "$EXPECTED_WORKFLOW_REF" ]] || { echo 'Workflow ref mismatch.' >&2; exit 1; }
          [[ "$GCP_DEPLOY_SERVICE_ACCOUNT" == "$EXPECTED_DEPLOY_SA" ]] || { echo 'Deploy service-account identity mismatch.' >&2; exit 1; }
          [[ "$GCP_WORKLOAD_IDENTITY_PROVIDER" == "projects/${EXPECTED_PROJECT_NUMBER}/locations/global/workloadIdentityPools/github-actions-firebase-health/providers/clickandsaveai-firebase-health" ]] || { echo 'Firebase health WIF provider mismatch.' >&2; exit 1; }

      - name: Check out exact health-policy source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify deployment run and Firebase deployment job belong to exact source SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_JSON="$(gh api --method GET "/repos/$GITHUB_REPOSITORY/actions/runs/$DEPLOYMENT_RUN_ID")"
          [[ "$(printf '%s' "$RUN_JSON" | jq -r '.head_sha // empty')" == "$SOURCE_SHA" ]] || { echo 'Deployment run source SHA mismatch.' >&2; exit 1; }
          [[ "$(printf '%s' "$RUN_JSON" | jq -r '.conclusion // empty')" == 'success' ]] || { echo 'Deployment run did not complete successfully.' >&2; exit 1; }
          JOBS_JSON="$(gh api --method GET "/repos/$GITHUB_REPOSITORY/actions/runs/$DEPLOYMENT_RUN_ID/jobs?per_page=100")"
          DEPLOY_OK="$(printf '%s' "$JOBS_JSON" | jq -r '[.jobs[] | select(.name == "deploy-firebase-production" and .conclusion == "success")] | length')"
          [[ "$DEPLOY_OK" == '1' ]] || { echo 'Successful deploy-firebase-production evidence is missing.' >&2; exit 1; }

      - name: Download exact signed production candidate from deployment run
        uses: actions/download-artifact@v4
        with:
          name: clickandsaveai-production-candidate-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/firebase-production-health-input
          run-id: ${{ env.DEPLOYMENT_RUN_ID }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}

      - name: Verify exact candidate identity
        shell: bash
        run: |
          set -euo pipefail
          IDENTITY="$RUNNER_TEMP/firebase-production-health-input/identity.txt"
          [[ -f "$IDENTITY" ]] || { echo 'Firebase deployment candidate evidence is missing.' >&2; exit 1; }
          grep -Fqx "source_sha=$SOURCE_SHA" "$IDENTITY" || { echo 'Firebase deployment candidate source mismatch.' >&2; exit 1; }
          grep -Fqx "application_id=$EXPECTED_PACKAGE" "$IDENTITY" || { echo 'Firebase deployment candidate package mismatch.' >&2; exit 1; }
          grep -Fqx "firebase_project_id=$EXPECTED_PROJECT_ID" "$IDENTITY" || { echo 'Firebase deployment candidate project mismatch.' >&2; exit 1; }
          echo "FIREBASE_DEPLOYMENT_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Authenticate Firebase health identity with GitHub OIDC
        uses: google-github-actions/auth@v3
        with:
          create_credentials_file: 'true'
          cleanup_credentials: 'true'
          project_id: ${{ env.EXPECTED_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.24.0

      - name: Evaluate fail-closed Firebase production health policy
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/firebase-production-health-output"
          TELEMETRY_JSON="$OUT/telemetry.json"
          EVIDENCE="$OUT/evidence.txt"
          mkdir -p "$OUT"

          FIREBASE_INVENTORY_OK=false
          SMOKE_OK=false
          if firebase functions:list --project "$EXPECTED_PROJECT_ID" --json > "$OUT/functions.json" 2>/dev/null; then
            if jq -e '(.result // .) | type == "array" and length > 0' "$OUT/functions.json" >/dev/null; then
              FIREBASE_INVENTORY_OK=true
            fi
          fi
          if firebase projects:list --json > "$OUT/projects.json" 2>/dev/null; then
            if jq -e --arg project "$EXPECTED_PROJECT_ID" '(.result // .) | any((.projectId // .project_id // "") == $project)' "$OUT/projects.json" >/dev/null; then
              SMOKE_OK=true
            fi
          fi

          jq -n \
            --argjson firebase_inventory_ok "$FIREBASE_INVENTORY_OK" \
            --argjson smoke_ok "$SMOKE_OK" \
            '{firebase_inventory_ok:$firebase_inventory_ok,smoke_ok:$smoke_ok,telemetry_complete:($firebase_inventory_ok and $smoke_ok)}' \
            > "$TELEMETRY_JSON"

          set +e
          node scripts/production-health-gate.mjs config/production-release-policy.json "$TELEMETRY_JSON" firebase
          POLICY_RC=$?
          set -e

          if [[ "$POLICY_RC" -eq 0 ]]; then
            STATUS=healthy
          else
            STATUS=rollback-required
          fi

          printf '%s\n' \
            "source_sha=$SOURCE_SHA" \
            "deployment_run_id=$DEPLOYMENT_RUN_ID" \
            "project_id=$EXPECTED_PROJECT_ID" \
            "health_status=$STATUS" \
            "telemetry_complete=$(jq -r '.telemetry_complete' "$TELEMETRY_JSON")" \
            > "$EVIDENCE"
          echo "FIREBASE_HEALTH_STATUS=$STATUS" >> "$GITHUB_ENV"
          echo "FIREBASE_HEALTH_OUTPUT=$OUT" >> "$GITHUB_ENV"

      - name: Upload Firebase production health evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: firebase-production-health-${{ env.SOURCE_SHA }}
          path: ${{ env.FIREBASE_HEALTH_OUTPUT }}
          if-no-files-found: error
          retention-days: 30

      - name: Fail closed when health is not verified
        shell: bash
        run: |
          set -euo pipefail
          [[ "$FIREBASE_HEALTH_STATUS" == 'healthy' ]] || { echo 'Firebase Production health is blocked; rollback_required=true.' >&2; exit 1; }
