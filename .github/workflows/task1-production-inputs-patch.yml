name: Task 1 Production Inputs Patch

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.pull_request.head.ref == 'feat/guarded-production-autonomy' && github.event.pull_request.user.login == github.repository_owner }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact feature head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Apply Task 1 minimal GREEN patch
        shell: python
        run: |
          from pathlib import Path
          path = Path('.github/workflows/production-release.yml')
          text = path.read_text()
          if 'authorize_google_play_production:' not in text:
              needle = '''      authorize_google_play_internal_testing:\n        description: Type PUBLISH_GOOGLE_PLAY_INTERNAL_TESTING only when the signed candidate should be published to the Internal Testing track\n        required: true\n        default: NO_PLAY_UPLOAD\n        type: string\n'''
              block = needle + '''      authorize_google_play_production:\n        description: Type PUBLISH_GOOGLE_PLAY_PRODUCTION_STAGED only for a staged Production rollout\n        required: true\n        default: NO_PRODUCTION_UPLOAD\n        type: string\n      production_rollout_percent:\n        description: Requested staged rollout percentage: 5, 20, 50, or 100\n        required: true\n        default: '5'\n        type: string\n'''
              if needle not in text:
                  raise SystemExit('Internal Testing input block not found; refusing patch')
              path.write_text(text.replace(needle, block, 1))

      - name: Verify focused Task 1 contract
        working-directory: functions
        run: node --test test/googlePlayInternalTestingWorkflow.test.js test/productionAutonomyWorkflow.test.js

      - name: Create detached tested commit through Git Data API
        env:
          GH_TOKEN: ${{ github.token }}
          PARENT_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          BASE_TREE="$(git rev-parse HEAD^{tree})"
          echo 'git-data-stage=base-tree-local-ok'
          PATCHED_CONTENT="$(base64 -w0 .github/workflows/production-release.yml)"
          BLOB_SHA="$(jq -cn --arg content "$PATCHED_CONTENT" '{content:$content,encoding:"base64"}' | gh api --method POST "/repos/$GITHUB_REPOSITORY/git/blobs" --input - --jq '.sha')"
          echo 'git-data-stage=blob-ok'
          TREE_SHA="$(jq -cn --arg base "$BASE_TREE" --arg blob "$BLOB_SHA" '{base_tree:$base,tree:[{path:".github/workflows/production-release.yml",mode:"100644",type:"blob",sha:$blob},{path:".github/workflows/task1-production-inputs-patch.yml",mode:"100644",type:"blob",sha:null}]}' | gh api --method POST "/repos/$GITHUB_REPOSITORY/git/trees" --input - --jq '.sha')"
          echo 'git-data-stage=tree-ok'
          COMMIT_SHA="$(jq -cn --arg message 'ci: add isolated production rollout authorization' --arg tree "$TREE_SHA" --arg parent "$PARENT_SHA" '{message:$message,tree:$tree,parents:[$parent]}' | gh api --method POST "/repos/$GITHUB_REPOSITORY/git/commits" --input - --jq '.sha')"
          echo 'git-data-stage=commit-ok'
          [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Detached commit creation failed.' >&2; exit 1; }
          printf '%s\n' "$COMMIT_SHA" > "$RUNNER_TEMP/task1-commit-sha.txt"

      - name: Export detached commit SHA
        uses: actions/upload-artifact@v4
        with:
          name: task1-detached-commit
          path: ${{ runner.temp }}/task1-commit-sha.txt
          if-no-files-found: error
          retention-days: 1
