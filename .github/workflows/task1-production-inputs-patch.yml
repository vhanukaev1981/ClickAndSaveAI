name: Task 1 Production Inputs Patch

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.pull_request.head.ref == 'feat/guarded-production-autonomy' && github.event.pull_request.user.login == github.repository_owner }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/guarded-production-autonomy
          fetch-depth: 0

      - name: Apply Task 1 minimal GREEN patch
        shell: python
        run: |
          from pathlib import Path
          path = Path('.github/workflows/production-release.yml')
          text = path.read_text()
          if 'authorize_google_play_production:' not in text:
              needle = '''      authorize_google_play_internal_testing:\n        description: Type PUBLISH_GOOGLE_PLAY_INTERNAL_TESTING only when the signed candidate should be published to the Internal Testing track\n        required: true\n        default: NO_PLAY_UPLOAD\n        type: string\n'''
              block = needle + '''      authorize_google_play_production:\n        description: Type PUBLISH_GOOGLE_PLAY_PRODUCTION_STAGED only for a staged Production rollout\n        required: true\n        default: NO_PRODUCTION_UPLOAD\n        type: string\n      production_rollout_percent:\n        description: Requested staged rollout percentage: 5, 20, 50, or 100\n        required: true\n        default: '5'\n        type: string\n'''
              if needle not in text:
                  raise SystemExit('Internal Testing input block not found; refusing patch')
              path.write_text(text.replace(needle, block, 1))

      - name: Verify focused Task 1 contract
        working-directory: functions
        run: node --test test/googlePlayInternalTestingWorkflow.test.js test/productionAutonomyWorkflow.test.js

      - name: Remove one-shot patch workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/task1-production-inputs-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/production-release.yml .github/workflows/task1-production-inputs-patch.yml
          git diff --cached --quiet && exit 0
          git commit -m 'ci: add isolated production rollout authorization'
          git push origin HEAD:feat/guarded-production-autonomy
