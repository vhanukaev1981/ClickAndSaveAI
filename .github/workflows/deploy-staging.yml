name: Deploy Firebase Staging Locked ac210509

on:
  push:
    branches:
      - deploy/staging-ac210509

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-clickandsaveai-staging
  cancel-in-progress: false

env:
  LOCKED_DEPLOY_REF: ac2105098d698df06159f929f41595f91505c855
  FIREBASE_STAGING_PROJECT: clickandsaveai-staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30

    steps:
      - name: Verify GitHub WIF configuration exists
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$WIF_PROVIDER" || -z "$DEPLOY_SERVICE_ACCOUNT" ]]; then
            echo 'Missing GCP_WORKLOAD_IDENTITY_PROVIDER or GCP_DEPLOY_SERVICE_ACCOUNT in GitHub variables.' >&2
            exit 1
          fi

      - name: Check out locked Stream A ref
        uses: actions/checkout@v6
        with:
          ref: ${{ env.LOCKED_DEPLOY_REF }}

      - name: Verify immutable deployment source and staging target
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_REF="$(git rev-parse HEAD)"
          if [[ "$ACTUAL_REF" != "$LOCKED_DEPLOY_REF" ]]; then
            echo "Expected locked ref $LOCKED_DEPLOY_REF but checked out $ACTUAL_REF" >&2
            exit 1
          fi
          node <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('.firebaserc.example', 'utf8'));
          if (config?.projects?.default !== 'clickandsaveai-staging') {
            throw new Error('Repository staging project guard does not point at clickandsaveai-staging');
          }
          const firebase = JSON.parse(fs.readFileSync('firebase.json', 'utf8'));
          if (!firebase.functions || !firebase.firestore) {
            throw new Error('firebase.json does not define both Functions and Firestore deployment targets');
          }
          NODE

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install backend dependencies
        working-directory: functions
        run: npm install --ignore-scripts

      - name: Re-run backend tests before deployment
        working-directory: functions
        run: npm test

      - id: auth
        name: Authenticate to Google Cloud with GitHub OIDC
        uses: google-github-actions/auth@v3
        with:
          create_credentials_file: 'true'
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Install pinned Firebase CLI
        run: npm install --global firebase-tools@15.1.0

      - name: Deploy locked functions and Firestore to staging
        shell: bash
        run: |
          set -euo pipefail
          firebase deploy \
            --project "$FIREBASE_STAGING_PROJECT" \
            --only firestore:rules,firestore:indexes,functions \
            --non-interactive
