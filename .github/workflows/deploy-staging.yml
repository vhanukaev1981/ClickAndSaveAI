name: Deploy Firebase Staging

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character Core commit SHA to deploy after CI is green
        required: true
        type: string
      confirm_project:
        description: Type clickandsaveai-staging to confirm the deployment target
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-clickandsaveai-staging
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ inputs.source_sha }}
  CORE_BASE_SHA: ac2105098d698df06159f929f41595f91505c855

jobs:
  deploy:
    if: ${{ inputs.confirm_project == 'clickandsaveai-staging' }}
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30

    steps:
      - name: Check out exact Core source SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify immutable Core source
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'source_sha must be an exact lowercase 40-character commit SHA.' >&2
            exit 1
          fi
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [[ "$ACTUAL_SHA" != "$SOURCE_SHA" ]]; then
            echo "Expected Core SHA $SOURCE_SHA but checked out $ACTUAL_SHA." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$CORE_BASE_SHA" "$ACTUAL_SHA"; then
            echo "Requested SHA is not descended from approved Core base $CORE_BASE_SHA." >&2
            exit 1
          fi
          echo "Verified immutable Core source: $ACTUAL_SHA"

      - name: Verify staging deployment configuration
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          STAGING_SMOKE_USER_UID: ${{ vars.STAGING_SMOKE_USER_UID }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$WIF_PROVIDER" ]] || missing+=(GCP_WORKLOAD_IDENTITY_PROVIDER)
          [[ -n "$DEPLOY_SERVICE_ACCOUNT" ]] || missing+=(GCP_DEPLOY_SERVICE_ACCOUNT)
          [[ -n "$STAGING_SMOKE_USER_UID" ]] || missing+=(STAGING_SMOKE_USER_UID)
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing staging configuration:' >&2
            printf ' %s' "${missing[@]}" >&2
            printf '\n' >&2
            exit 1
          fi
          node <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('.firebaserc.example', 'utf8'));
          if (config?.projects?.default !== 'clickandsaveai-staging') {
            throw new Error('Repository staging project guard does not point at clickandsaveai-staging');
          }
          const firebase = JSON.parse(fs.readFileSync('firebase.json', 'utf8'));
          if (!firebase.functions || !firebase.firestore) {
            throw new Error('firebase.json does not define both Functions and Firestore deployment targets');
          }
          NODE

      - name: Derive staging Firebase smoke config
        env:
          STAGING_GOOGLE_SERVICES_JSON_B64: ${{ secrets.STAGING_GOOGLE_SERVICES_JSON_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$STAGING_GOOGLE_SERVICES_JSON_B64" ]]; then
            echo 'STAGING_GOOGLE_SERVICES_JSON_B64 is required for authenticated staging smoke.' >&2
            exit 1
          fi
          CONFIG_PATH="$RUNNER_TEMP/google-services-staging.json"
          printf '%s' "$STAGING_GOOGLE_SERVICES_JSON_B64" | base64 --decode > "$CONFIG_PATH"
          chmod 600 "$CONFIG_PATH"
          STAGING_FIREBASE_CONFIG_PATH="$CONFIG_PATH" node <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync(process.env.STAGING_FIREBASE_CONFIG_PATH, 'utf8'));
          if (config?.project_info?.project_id !== 'clickandsaveai-staging') {
            throw new Error('google-services staging config targets the wrong project');
          }
          const client = (Array.isArray(config.client) ? config.client : []).find(
            (item) => item?.client_info?.android_client_info?.package_name === 'com.aistudio.clickandsaveai.app'
          );
          const apiKey = client?.api_key?.[0]?.current_key;
          const appId = client?.client_info?.mobilesdk_app_id;
          if (!apiKey || !appId) {
            throw new Error('staging google-services config is missing API key or Android app ID');
          }
          fs.appendFileSync(process.env.GITHUB_ENV, `STAGING_FIREBASE_API_KEY=${apiKey}\n`, { encoding: 'utf8' });
          fs.appendFileSync(process.env.GITHUB_ENV, `STAGING_APPCHECK_APP_ID=${appId}\n`, { encoding: 'utf8' });
          NODE
          rm -f "$CONFIG_PATH"
          echo 'Derived staging Firebase smoke config without logging its values.'

      - id: auth
        name: Authenticate to Google Cloud with GitHub OIDC
        uses: google-github-actions/auth@v3
        with:
          create_credentials_file: 'true'
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install backend dependencies
        working-directory: functions
        run: npm install --ignore-scripts

      - name: Re-run backend tests before deployment
        working-directory: functions
        run: npm test

      - name: Install pinned Firebase CLI
        run: npm install --global firebase-tools@15.1.0

      - name: Deploy functions and Firestore to staging
        shell: bash
        run: |
          set -euo pipefail
          firebase deploy \
            --project clickandsaveai-staging \
            --only firestore:rules,firestore:indexes,functions \
            --non-interactive

      - name: Run authenticated staging truth smoke
        env:
          STAGING_SMOKE_USER_UID: ${{ vars.STAGING_SMOKE_USER_UID }}
          GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          STAGING_SMOKE_OUTPUT: ${{ runner.temp }}/staging-core-smoke.json
        shell: bash
        run: |
          set -euo pipefail
          node scripts/staging-core-smoke.mjs

      - name: Upload sanitized staging smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: staging-core-smoke-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/staging-core-smoke.json
          if-no-files-found: error
          retention-days: 14
