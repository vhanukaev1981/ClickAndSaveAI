name: Deploy Firebase Staging

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character Block 5 commit SHA to deploy after CI is green
        required: true
        type: string
      confirm_project:
        description: Type clickandsaveai-staging to confirm the deployment target
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: deploy-clickandsaveai-staging
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ inputs.source_sha }}
  BLOCK5_BASE_SHA: 7fa4b23cf927ca1dada6c61c51f48477996a5a66

jobs:
  deploy:
    if: ${{ inputs.confirm_project == 'clickandsaveai-staging' }}
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30

    steps:
      - name: Guard exact Block 5 deployment source
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'source_sha must be an exact lowercase 40-character Git commit SHA.' >&2
            exit 1
          fi

      - name: Check out exact Block 5 source SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify immutable Block 5 lineage
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [[ "$ACTUAL_SHA" != "$SOURCE_SHA" ]]; then
            echo "Expected Block 5 SHA $SOURCE_SHA but checked out $ACTUAL_SHA." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$BLOCK5_BASE_SHA" "$ACTUAL_SHA"; then
            echo "Requested SHA is not descended from approved Block 4 SHA $BLOCK5_BASE_SHA." >&2
            exit 1
          fi
          echo "Verified immutable Block 5 source: $ACTUAL_SHA"

      - name: Require full CI success on exact source SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          required_workflows=(
            'android-ci.yml|Android and Backend CI'
            'production-operations-ci.yml|Production Operations CI'
            'production-enablement-ci.yml|Production Enablement Security CI'
          )
          for entry in "${required_workflows[@]}"; do
            IFS='|' read -r workflow_file workflow_name <<< "$entry"
            RUNS="$(gh api --method GET "/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_file/runs?head_sha=$SOURCE_SHA&per_page=20")"
            STATUS="$(printf '%s' "$RUNS" | jq -r '.workflow_runs[0].status // ""')"
            CONCLUSION="$(printf '%s' "$RUNS" | jq -r '.workflow_runs[0].conclusion // ""')"
            RUN_NUMBER="$(printf '%s' "$RUNS" | jq -r '.workflow_runs[0].run_number // ""')"
            if [[ "$STATUS" != "completed" || "$CONCLUSION" != "success" ]]; then
              echo "$workflow_name is not completed SUCCESS for exact source SHA $SOURCE_SHA." >&2
              exit 1
            fi
            echo "Verified $workflow_name #$RUN_NUMBER SUCCESS for exact source SHA $SOURCE_SHA."
          done

      - name: Verify staging deployment configuration
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          STAGING_SMOKE_USER_UID: ${{ vars.STAGING_SMOKE_USER_UID }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$WIF_PROVIDER" ]] || missing+=(GCP_WORKLOAD_IDENTITY_PROVIDER)
          [[ -n "$DEPLOY_SERVICE_ACCOUNT" ]] || missing+=(GCP_DEPLOY_SERVICE_ACCOUNT)
          [[ -n "$STAGING_SMOKE_USER_UID" ]] || missing+=(STAGING_SMOKE_USER_UID)
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing staging configuration:' >&2
            printf ' %s' "${missing[@]}" >&2
            printf '\n' >&2
            exit 1
          fi
          node <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('.firebaserc.example', 'utf8'));
          if (config?.projects?.default !== 'clickandsaveai-staging') {
            throw new Error('Repository staging project guard does not point at clickandsaveai-staging');
          }
          const firebase = JSON.parse(fs.readFileSync('firebase.json', 'utf8'));
          if (!firebase.functions || !firebase.firestore) {
            throw new Error('firebase.json does not define both Functions and Firestore deployment targets');
          }
          NODE

      - name: Materialize staging Functions string parameters
        shell: bash
        run: |
          set -euo pipefail
          test -f functions/.env.example
          if ! grep -Eq '^GOOGLE_OAUTH_CLIENT_ID=[^[:space:]]+\.apps\.googleusercontent\.com$' functions/.env.example; then
            echo 'functions/.env.example is missing a valid staging GOOGLE_OAUTH_CLIENT_ID.' >&2
            exit 1
          fi
          cp functions/.env.example functions/.env.clickandsaveai-staging
          chmod 600 functions/.env.clickandsaveai-staging
          echo 'Materialized non-secret staging Functions parameters from the repository-approved example.'

      - name: Derive staging Firebase smoke config
        env:
          STAGING_GOOGLE_SERVICES_JSON_B64: ${{ secrets.STAGING_GOOGLE_SERVICES_JSON_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$STAGING_GOOGLE_SERVICES_JSON_B64" ]]; then
            echo 'STAGING_GOOGLE_SERVICES_JSON_B64 is required for authenticated staging smoke.' >&2
            exit 1
          fi
          CONFIG_PATH="$RUNNER_TEMP/google-services-staging.json"
          printf '%s' "$STAGING_GOOGLE_SERVICES_JSON_B64" | base64 --decode > "$CONFIG_PATH"
          chmod 600 "$CONFIG_PATH"
          STAGING_FIREBASE_CONFIG_PATH="$CONFIG_PATH" node <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync(process.env.STAGING_FIREBASE_CONFIG_PATH, 'utf8'));
          if (config?.project_info?.project_id !== 'clickandsaveai-staging') {
            throw new Error('google-services staging config targets the wrong project');
          }
          const client = (Array.isArray(config.client) ? config.client : []).find(
            (item) => item?.client_info?.android_client_info?.package_name === 'com.aistudio.clickandsaveai.app'
          );
          const apiKey = client?.api_key?.[0]?.current_key;
          const appId = client?.client_info?.mobilesdk_app_id;
          if (!apiKey || !appId) {
            throw new Error('staging google-services config is missing API key or Android app ID');
          }
          fs.appendFileSync(process.env.GITHUB_ENV, `STAGING_FIREBASE_API_KEY=${apiKey}\n`, { encoding: 'utf8' });
          fs.appendFileSync(process.env.GITHUB_ENV, `STAGING_APPCHECK_APP_ID=${appId}\n`, { encoding: 'utf8' });
          NODE
          rm -f "$CONFIG_PATH"
          echo 'Derived staging Firebase smoke config without logging its values.'

      - name: Report safe GitHub OIDC claims
        shell: bash
        run: |
          set -euo pipefail
          OIDC_RESPONSE="$(curl -fsSL \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=clickandsaveai-wif-diagnostic")"
          OIDC_TOKEN="$(printf '%s' "$OIDC_RESPONSE" | jq -r '.value // empty')"
          if [[ -z "$OIDC_TOKEN" ]]; then
            echo 'GitHub did not return an OIDC diagnostic token.' >&2
            exit 1
          fi
          export OIDC_TOKEN
          node <<'NODE'
          const token = process.env.OIDC_TOKEN || '';
          const parts = token.split('.');
          if (parts.length !== 3) throw new Error('Unexpected GitHub OIDC token format.');
          const claims = JSON.parse(Buffer.from(parts[1], 'base64url').toString('utf8'));
          const safe = {
            repository: claims.repository || '',
            repository_id: claims.repository_id || '',
            repository_owner_id: claims.repository_owner_id || '',
            environment: claims.environment || '',
            ref: claims.ref || '',
            job_workflow_ref: claims.job_workflow_ref || '',
            workflow_ref: claims.workflow_ref || '',
            event_name: claims.event_name || '',
            sub: claims.sub || '',
          };
          console.log(`SAFE_OIDC_CLAIMS=${JSON.stringify(safe)}`);
          NODE
          unset OIDC_TOKEN

      - id: auth
        name: Authenticate to Google Cloud with GitHub OIDC
        uses: google-github-actions/auth@v3
        with:
          create_credentials_file: 'true'
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install backend dependencies
        working-directory: functions
        run: npm install --ignore-scripts

      - name: Re-run backend tests before deployment
        working-directory: functions
        run: npm test

      - name: Install pinned Firebase CLI
        run: npm install --global firebase-tools@15.1.0

      - name: Verify retry-enabled invoice notification is idempotent before force deploy
        shell: bash
        run: |
          set -euo pipefail
          source_file='functions/src/gmailInvoiceNotificationFunctions.js'
          grep -Fq 'exports.onAuthoritativeGmailInvoiceCreated = onDocumentCreated(' "$source_file"
          grep -Fq 'retry: true' "$source_file"
          grep -Fq 'const eventId = `bill-detected:${sourceMessageId}`;' "$source_file"
          grep -Fq '.doc(deliveryDocumentId(eventId));' "$source_file"
          grep -Fq 'const claimed = await db.runTransaction' "$source_file"
          grep -Fq 'data.status === "SENT" || data.status === "NO_DEVICE" || data.status === "ACCOUNT_DELETED"' "$source_file"
          grep -Fq 'status: "RETRYABLE_FAILURE"' "$source_file"
          echo 'Verified intentional retry policy with deterministic delivery identity, transaction lease and terminal-state suppression.'

      - name: Run Staging Artifact Registry cleanup preflight
        env:
          STAGING_ARTIFACT_CLEANUP_EVIDENCE: ${{ runner.temp }}/staging-artifact-cleanup-preflight.json
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/staging-artifact-cleanup-preflight.sh
          echo 'STAGING_ARTIFACT_CLEANUP_PREFLIGHT_VERIFIED=1' >> "$GITHUB_ENV"

      - name: Upload sanitized Staging Artifact Registry cleanup evidence
        uses: actions/upload-artifact@v4
        with:
          name: staging-artifact-cleanup-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/staging-artifact-cleanup-preflight.json
          if-no-files-found: error
          retention-days: 14

      - name: Deploy Firestore to staging
        shell: bash
        run: |
          set -euo pipefail
          firebase deploy \
            --project clickandsaveai-staging \
            --only firestore:rules,firestore:indexes \
            --non-interactive \
            --force
          touch "$RUNNER_TEMP/staging-firestore-deploy-proven"

      - name: Deploy Functions to staging with guarded classifier
        env:
          FIREBASE_DEPLOY_LOG: ${{ runner.temp }}/firebase-functions-deploy.log
          DEPLOYED_FUNCTIONS: ${{ runner.temp }}/staging-deployed-functions.txt
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/staging-firestore-deploy-proven"
          set +e
          firebase deploy \
            --project clickandsaveai-staging \
            --only functions \
            --non-interactive \
            --force \
            2>&1 | tee "$FIREBASE_DEPLOY_LOG"
          FIREBASE_DEPLOY_EXIT="${PIPESTATUS[0]}"
          set -e
          echo "Firebase deploy exit code: $FIREBASE_DEPLOY_EXIT"

          # The classifier recognizes only the explicit Firebase post-success text
          # "Functions successfully deployed but could not set up cleanup policy"
          # together with successful function operations and no fatal deploy evidence.
          if ! node scripts/staging-firebase-deploy-classifier.mjs \
            --exit-code "$FIREBASE_DEPLOY_EXIT" \
            --log "$FIREBASE_DEPLOY_LOG" \
            --write-functions "$DEPLOYED_FUNCTIONS"; then
            echo 'Firebase Functions deployment was not proven safe to continue.' >&2
            exit 1
          fi

      - name: Verify deployed staging Functions are ACTIVE
        env:
          DEPLOYED_FUNCTIONS: ${{ runner.temp }}/staging-deployed-functions.txt
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s "$DEPLOYED_FUNCTIONS" ]]; then
            echo 'Firebase reported no function create/update operations; deploy exited successfully.'
            exit 0
          fi
          while IFS= read -r function_name; do
            [[ -n "$function_name" ]] || continue
            if state="$(gcloud functions describe "$function_name" \
              --gen2 \
              --region=us-central1 \
              --project=clickandsaveai-staging \
              --format='value(state)' 2>/dev/null)"; then
              generation='GEN_2'
            elif state="$(gcloud functions describe "$function_name" \
              --region=us-central1 \
              --project=clickandsaveai-staging \
              --format='value(status)' 2>/dev/null)"; then
              generation='GEN_1'
            else
              echo "Unable to independently describe deployed function $function_name." >&2
              exit 1
            fi
            if [[ "$state" != "ACTIVE" ]]; then
              echo "Deployed function $function_name is not ACTIVE ($generation state=$state)." >&2
              exit 1
            fi
            echo "Verified ACTIVE: $function_name ($generation)."
          done < "$DEPLOYED_FUNCTIONS"

      - name: Run authenticated staging truth smoke
        env:
          STAGING_SMOKE_USER_UID: ${{ vars.STAGING_SMOKE_USER_UID }}
          GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          STAGING_SMOKE_OUTPUT: ${{ runner.temp }}/staging-core-smoke.json
        shell: bash
        run: |
          set -euo pipefail
          node scripts/staging-core-smoke.mjs

      - name: Upload sanitized staging smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: staging-core-smoke-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/staging-core-smoke.json
          if-no-files-found: error
          retention-days: 14

      - name: Run Block 5 destructive lifecycle E2E with ephemeral accounts
        env:
          GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          STAGING_BLOCK5_E2E_OUTPUT: ${{ runner.temp }}/staging-block5-e2e.json
        shell: bash
        run: |
          set -euo pipefail
          node scripts/staging-block5-e2e.mjs

      - name: Upload sanitized Block 5 staging E2E evidence
        uses: actions/upload-artifact@v4
        with:
          name: staging-block5-e2e-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/staging-block5-e2e.json
          if-no-files-found: error
          retention-days: 14
