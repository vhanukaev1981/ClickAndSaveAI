name: Production Enablement Security CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-enablement-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  P0_SHA: 6a3a3ac2dcbeef16260cb8d7456568a41c80fa01

jobs:
  production-security:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact candidate with full history
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify exact source and P0 lineage
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]] || exit 1
          git merge-base --is-ancestor "$P0_SHA" "$SOURCE_SHA"
          echo "Production Enablement candidate: $SOURCE_SHA"

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Strengthened current-tree secret audit
        env:
          SECRET_AUDIT_OUTPUT: ${{ runner.temp }}/secret-current.json
        run: node scripts/repository-secret-audit.mjs current

      - name: Full Git-history secret audit
        env:
          SECRET_AUDIT_OUTPUT: ${{ runner.temp }}/secret-history.json
        run: node scripts/repository-secret-audit.mjs history

      - name: Production environment isolation guard
        run: node scripts/production-readiness-guard.mjs repository

      - name: Backend regression and production dependency audit
        working-directory: functions
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts
          npm test
          npm audit --omit=dev --audit-level=high

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Prove production signing fails closed without credentials
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/production-signing-fail-closed.log"
          set +e
          PRODUCTION_RELEASE_CANDIDATE=true \
          PRODUCTION_GOOGLE_WEB_CLIENT_ID='123456789012-production-readiness.apps.googleusercontent.com' \
            gradle --no-daemon help >"$LOG" 2>&1
          status=$?
          set -e
          if [[ "$status" -eq 0 ]]; then
            echo 'Production release configuration unexpectedly succeeded without signing material.' >&2
            exit 1
          fi
          grep -q 'PRODUCTION_UPLOAD_KEYSTORE_PATH' "$LOG" || {
            echo 'Production fail-closed error did not identify the missing signing input.' >&2
            exit 1
          }
          echo 'Production signing configuration fails closed when secure signing material is absent.'

      - name: Clean up stale empty Room schema files
        shell: bash
        run: find . -path "*/schemas/*.json" -empty -delete 2>/dev/null || true

      - name: Android regression, lint and debug audit build
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Clean up Room schema files before release audit
        shell: bash
        run: find . -path "*/schemas/*.json" -empty -delete 2>/dev/null || true

      - name: Android unsigned release audit builds
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon assembleRelease bundleRelease --stacktrace

      - name: Confirm normal CI release audit is not a signed production candidate
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          [[ -n "$APK" ]] || { echo 'Release audit APK missing.' >&2; exit 1; }
          if "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" >/dev/null 2>&1; then
            echo 'Normal CI release audit must remain unsigned and must never be mistaken for production.' >&2
            exit 1
          fi
          echo 'Unsigned release audit remains distinct from signed production candidate path.'

      - name: Upload sanitized secret-audit evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: production-enablement-secret-audit-${{ env.SOURCE_SHA }}
          path: |
            ${{ runner.temp }}/secret-current.json
            ${{ runner.temp }}/secret-history.json
          if-no-files-found: warn
          retention-days: 14
