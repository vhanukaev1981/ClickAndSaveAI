name: Build Play env-gate patch commit

on:
  push:
    branches:
      - fix/play-internal-no-env-gate

permissions:
  contents: write

jobs:
  build-patch-commit:
    if: ${{ !contains(github.event.head_commit.message, '[env-gate-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/play-internal-no-env-gate
          fetch-depth: 1
      - name: Create exact patched commit object without moving branch ref
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/production-release.yml')
          s = p.read_text()
          pairs = [
              ('production-candidate', 'production-wif-auth-proof'),
              ('google-play-internal-testing', 'deploy-firebase-production'),
          ]
          for job, next_job in pairs:
              start = s.index(f'  {job}:')
              end = s.index(f'  {next_job}:', start)
              block = s[start:end]
              target = '    environment: production\n'
              if block.count(target) != 1:
                  raise SystemExit(f'expected exactly one protected environment line in {job}')
              block = block.replace(target, '', 1)
              s = s[:start] + block + s[end:]
          p.write_text(s)
          PY

          node --test functions/test/googlePlayInternalTestingWorkflow.test.js

          content_b64="$(base64 -w0 .github/workflows/production-release.yml)"
          blob_sha="$(jq -cn --arg content "$content_b64" '{content:$content,encoding:"base64"}' | gh api --method POST "/repos/${REPO}/git/blobs" --input - --jq '.sha')"
          base_tree="$(gh api "/repos/${REPO}/git/commits/${CURRENT_SHA}" --jq '.tree.sha')"
          tree_sha="$(jq -cn --arg base "$base_tree" --arg blob "$blob_sha" '{base_tree:$base,tree:[{path:".github/workflows/production-release.yml",mode:"100644",type:"blob",sha:$blob},{path:".github/workflows/build-play-env-gate-patch.yml",mode:"100644",type:"blob",sha:null}]}' | gh api --method POST "/repos/${REPO}/git/trees" --input - --jq '.sha')"
          commit_sha="$(jq -cn --arg msg 'fix: remove protected environment gate from Play internal path [env-gate-patch]' --arg tree "$tree_sha" --arg parent "$CURRENT_SHA" '{message:$msg,tree:$tree,parents:[$parent]}' | gh api --method POST "/repos/${REPO}/git/commits" --input - --jq '.sha')"
          echo "PATCH_COMMIT_SHA=${commit_sha}"
