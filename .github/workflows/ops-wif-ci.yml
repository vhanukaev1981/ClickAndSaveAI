name: Validate Staging WIF Bootstrap

on:
  push:
    branches:
      - ops/bootstrap-staging-wif
    paths:
      - scripts/bootstrap-staging-wif.sh
      - scripts/verify-staging-wif.sh
      - scripts/configure-github-staging-vars.sh
      - .github/workflows/deploy-staging.yml
      - .github/workflows/ops-wif-ci.yml
  pull_request:
    paths:
      - scripts/bootstrap-staging-wif.sh
      - scripts/verify-staging-wif.sh
      - scripts/configure-github-staging-vars.sh
      - .github/workflows/deploy-staging.yml
      - .github/workflows/ops-wif-ci.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Validate Bash syntax
        run: |
          bash -n \
            scripts/bootstrap-staging-wif.sh \
            scripts/verify-staging-wif.sh \
            scripts/configure-github-staging-vars.sh

      - name: Enforce keyless and scoped trust guardrails
        shell: bash
        run: |
          set -euo pipefail
          script='scripts/bootstrap-staging-wif.sh'
          grep -Fq 'GITHUB_REPOSITORY_ID="${GITHUB_REPOSITORY_ID:-1314210715}"' "$script"
          grep -Fq 'GITHUB_REPOSITORY_OWNER_ID="${GITHUB_REPOSITORY_OWNER_ID:-64756523}"' "$script"
          grep -Fq 'GITHUB_ENVIRONMENT="${GITHUB_ENVIRONMENT:-staging}"' "$script"
          grep -Fq 'GITHUB_REF="${GITHUB_REF:-refs/heads/main}"' "$script"
          grep -Fq 'GITHUB_JOB_WORKFLOW_REF="${GITHUB_JOB_WORKFLOW_REF:-vhanukaev1981/ClickAndSaveAI/.github/workflows/deploy-staging.yml@refs/heads/main}"' "$script"
          grep -Fq "assertion.repository_id=='\${GITHUB_REPOSITORY_ID}'" "$script"
          grep -Fq "assertion.repository_owner_id=='\${GITHUB_REPOSITORY_OWNER_ID}'" "$script"
          grep -Fq "assertion.environment=='\${GITHUB_ENVIRONMENT}'" "$script"
          grep -Fq "assertion.ref=='\${GITHUB_REF}'" "$script"
          grep -Fq "assertion.job_workflow_ref=='\${GITHUB_JOB_WORKFLOW_REF}'" "$script"

          if grep -Eq 'service-accounts keys (create|upload)|iam service-accounts keys create' \
            scripts/bootstrap-staging-wif.sh scripts/verify-staging-wif.sh scripts/configure-github-staging-vars.sh; then
            echo 'Service-account key creation is forbidden for this bootstrap.' >&2
            exit 1
          fi

      - name: Require deployer self-signing only for short-lived smoke tokens
        shell: bash
        run: |
          set -euo pipefail
          script='scripts/bootstrap-staging-wif.sh'
          grep -Fq 'roles/iam.serviceAccountTokenCreator' "$script"
          grep -Fq -- '--member="serviceAccount:${DEPLOY_SA_EMAIL}"' "$script"
          grep -Fq 'Granting deployer Token Creator on itself for short-lived staging smoke tokens' "$script"

          if grep -Eq 'projects add-iam-policy-binding.*serviceAccountTokenCreator|PROJECT_ROLES=.*serviceAccountTokenCreator' "$script"; then
            echo 'Token Creator must not be granted project-wide.' >&2
            exit 1
          fi

      - name: Require one-command GitHub staging variable configuration
        shell: bash
        run: |
          set -euo pipefail
          script='scripts/configure-github-staging-vars.sh'
          grep -Fq 'STAGING_SMOKE_USER_UID="${STAGING_SMOKE_USER_UID:-}"' "$script"
          grep -Fq '[[ -n "$STAGING_SMOKE_USER_UID" ]] || fail' "$script"
          grep -Fq 'gh variable set STAGING_SMOKE_USER_UID' "$script"
          grep -Fq 'ACTUAL_SMOKE_UID=' "$script"
          grep -Fq '[[ "$ACTUAL_SMOKE_UID" == "$STAGING_SMOKE_USER_UID" ]]' "$script"
          grep -Fq 'PASS: GitHub staging variables configured and verified.' "$script"

          if grep -Eq 'STAGING_SMOKE_USER_UID=\$\{|STAGING_SMOKE_USER_UID=\$STAGING_SMOKE_USER_UID|STAGING_SMOKE_USER_UID=\$\{STAGING_SMOKE_USER_UID\}' "$script"; then
            echo 'The staging smoke UID must not be printed in helper output.' >&2
            exit 1
          fi

      - name: Enforce immutable staging deployment source
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/deploy-staging.yml'

          grep -Fq 'source_sha:' "$workflow"
          grep -Fq 'ref: ${{ inputs.source_sha }}' "$workflow"
          grep -Fq 'ACTUAL_SHA="$(git rev-parse HEAD)"' "$workflow"
          grep -Fq 'if [[ "$ACTUAL_SHA" != "$SOURCE_SHA" ]]' "$workflow"
          grep -Fq 'git merge-base --is-ancestor "$SOURCE_SHA" origin/agent/ai-native-financial-core' "$workflow"
          grep -Fq -- '--project clickandsaveai-staging' "$workflow"
          grep -Fq 'environment: staging' "$workflow"
          grep -Fq 'id-token: write' "$workflow"

          if grep -Fq 'default: agent/ai-native-financial-core' "$workflow"; then
            echo 'Mutable branch deployment input is forbidden; deploy an exact commit SHA.' >&2
            exit 1
          fi
