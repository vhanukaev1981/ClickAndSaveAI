name: Patch Google Play publishing branch

on:
  push:
    branches:
      - feat/google-play-internal-testing-wif

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/google-play-internal-testing-wif
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Patch Production Release Gate once
        shell: python
        run: |
          from pathlib import Path
          p = Path('.github/workflows/production-release.yml')
          text = p.read_text()
          marker = 'authorize_google_play_internal_testing:'
          if marker not in text:
              needle = "      authorize_firebase_deploy:\n        description: Type DEPLOY_FIREBASE_PRODUCTION only when a separately authorized Firebase deployment is intended\n        required: true\n        default: NO_DEPLOY\n        type: string\n"
              addition = needle + "      authorize_google_play_internal_testing:\n        description: Type PUBLISH_GOOGLE_PLAY_INTERNAL_TESTING only when the signed candidate should be published to the Internal Testing track\n        required: true\n        default: NO_PLAY_UPLOAD\n        type: string\n"
              if needle not in text:
                  raise SystemExit('input insertion anchor not found')
              text = text.replace(needle, addition, 1)

              anchor = "  deploy-firebase-production:\n"
              job = r'''  google-play-internal-testing:
    needs: production-candidate
    if: ${{ inputs.authorize_google_play_internal_testing == 'PUBLISH_GOOGLE_PLAY_INTERNAL_TESTING' && inputs.authorize_firebase_deploy == 'NO_DEPLOY' && inputs.authorize_production_bootstrap == 'NO_BOOTSTRAP' && inputs.authorize_wif_auth_proof == 'NO_WIF_PROOF' && inputs.authorize_3f_metadata_probe == 'NO_3F_PROBE' && inputs.authorize_3f_external_authority_probe == 'NO_3F_EXTERNAL_PROBE' && inputs.authorize_3f_service_state_probe == 'NO_3F_SERVICE_STATE_PROBE' && inputs.authorize_3f_firebase_iam_permission_probe == 'NO_3F_FIREBASE_IAM_PERMISSION_PROBE' && inputs.confirm_environment == 'CLICKANDSAVEAI_PRODUCTION' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      EXPECTED_PROJECT_ID: click-save-ai-production
      EXPECTED_PROJECT_NUMBER: '991489557172'
      EXPECTED_PACKAGE: com.aistudio.clickandsaveai.app
      EXPECTED_PLAY_PUBLISHER_SA: clickandsaveai-play-publisher@click-save-ai-production.iam.gserviceaccount.com
      EXPECTED_REF: refs/heads/main
      EXPECTED_WORKFLOW_REF: vhanukaev1981/ClickAndSaveAI/.github/workflows/production-release.yml@refs/heads/main
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}

    steps:
      - name: Guard exact Google Play Internal Testing boundary
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ inputs.authorize_google_play_internal_testing }}' == 'PUBLISH_GOOGLE_PLAY_INTERNAL_TESTING' ]] || { echo 'Google Play Internal Testing authorization phrase mismatch.' >&2; exit 1; }
          [[ '${{ inputs.authorize_firebase_deploy }}' == 'NO_DEPLOY' ]] || { echo 'Internal Testing publish must not combine with Firebase deploy.' >&2; exit 1; }
          [[ '${{ github.sha }}' == "$SOURCE_SHA" ]] || { echo 'Internal Testing source must equal current main HEAD.' >&2; exit 1; }
          [[ '${{ github.ref }}' == "$EXPECTED_REF" ]] || { echo 'Git ref mismatch.' >&2; exit 1; }
          [[ '${{ github.workflow_ref }}' == "$EXPECTED_WORKFLOW_REF" ]] || { echo 'Workflow ref mismatch.' >&2; exit 1; }
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'source_sha must be an exact lowercase 40-character commit SHA.' >&2; exit 1; }
          [[ "$GCP_WORKLOAD_IDENTITY_PROVIDER" =~ ^projects/${EXPECTED_PROJECT_NUMBER}/locations/global/workloadIdentityPools/[^/]+/providers/[^/]+$ ]] || { echo 'WIF provider project-number boundary mismatch.' >&2; exit 1; }

      - name: Download exact signed Production candidate
        uses: actions/download-artifact@v4
        with:
          name: clickandsaveai-production-candidate-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/production-candidate

      - name: Verify candidate identity before Play mutation
        shell: bash
        run: |
          set -euo pipefail
          IDENTITY="${RUNNER_TEMP}/production-candidate/identity.txt"
          [[ -f "$IDENTITY" ]] || { echo 'Production candidate identity evidence is missing.' >&2; exit 1; }
          grep -Fqx "source_sha=$SOURCE_SHA" "$IDENTITY" || { echo 'Candidate source SHA mismatch.' >&2; exit 1; }
          grep -Fqx "application_id=$EXPECTED_PACKAGE" "$IDENTITY" || { echo 'Candidate package mismatch.' >&2; exit 1; }
          grep -Fqx 'release_approved=false' "$IDENTITY" || { echo 'Unexpected candidate release state.' >&2; exit 1; }
          AAB_NAME="$(sed -n 's/^aab_file=//p' "$IDENTITY" | head -n1)"
          EXPECTED_AAB_SHA="$(sed -n 's/^aab_sha256=//p' "$IDENTITY" | head -n1)"
          AAB_PATH="${RUNNER_TEMP}/production-candidate/${AAB_NAME}"
          [[ -f "$AAB_PATH" ]] || { echo 'Candidate AAB is missing.' >&2; exit 1; }
          [[ "$(sha256sum "$AAB_PATH" | awk '{print $1}')" == "$EXPECTED_AAB_SHA" ]] || { echo 'Candidate AAB digest mismatch.' >&2; exit 1; }
          echo "PLAY_AAB_PATH=$AAB_PATH" >> "$GITHUB_ENV"

      - name: Authenticate dedicated Google Play publisher with GitHub OIDC
        id: play_auth
        uses: google-github-actions/auth@v3
        with:
          create_credentials_file: 'false'
          cleanup_credentials: 'true'
          export_environment_variables: 'false'
          project_id: ${{ env.EXPECTED_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: clickandsaveai-play-publisher@click-save-ai-production.iam.gserviceaccount.com
          token_format: 'access_token'
          access_token_lifetime: '600s'
          access_token_scopes: 'https://www.googleapis.com/auth/androidpublisher'

      - name: Publish signed AAB to Google Play Internal Testing only
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.play_auth.outputs.access_token }}
        shell: bash
        run: |
          set -euo pipefail
          API="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/${EXPECTED_PACKAGE}"
          UPLOAD_API="https://upload.androidpublisher.googleapis.com/upload/androidpublisher/v3/applications/${EXPECTED_PACKAGE}"
          AUTH_HEADER="Authorization: Bearer ${PLAY_ACCESS_TOKEN}"

          EDIT_JSON="$(curl --fail-with-body --silent --show-error -X POST -H "$AUTH_HEADER" -H 'Content-Type: application/json' -d '{}' "${API}/edits")"
          EDIT_ID="$(printf '%s' "$EDIT_JSON" | jq -r '.id // empty')"
          [[ -n "$EDIT_ID" ]] || { echo 'Google Play edit ID missing.' >&2; exit 1; }

          BUNDLE_JSON="$(curl --fail-with-body --silent --show-error -X POST -H "$AUTH_HEADER" -H 'Content-Type: application/octet-stream' --data-binary "@${PLAY_AAB_PATH}" "${UPLOAD_API}/edits/${EDIT_ID}/bundles?uploadType=media")"
          VERSION_CODE="$(printf '%s' "$BUNDLE_JSON" | jq -r '.versionCode // empty')"
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] || { echo 'Uploaded bundle versionCode missing.' >&2; exit 1; }

          TRACK_PAYLOAD="$(jq -cn --arg version "$VERSION_CODE" '{track:"internal",releases:[{status:"completed",versionCodes:[$version]}]}')"
          curl --fail-with-body --silent --show-error -X PUT -H "$AUTH_HEADER" -H 'Content-Type: application/json' -d "$TRACK_PAYLOAD" "${API}/edits/${EDIT_ID}/tracks/internal" >/dev/null
          COMMIT_JSON="$(curl --fail-with-body --silent --show-error -X POST -H "$AUTH_HEADER" -H 'Content-Type: application/json' -d '{}' "${API}/edits/${EDIT_ID}:commit")"
          [[ "$(printf '%s' "$COMMIT_JSON" | jq -r '.id // empty')" == "$EDIT_ID" ]] || { echo 'Google Play edit commit was not confirmed.' >&2; exit 1; }
          echo "Published versionCode ${VERSION_CODE} to Google Play Internal Testing."

'''
              if anchor not in text:
                  raise SystemExit('job insertion anchor not found')
              text = text.replace(anchor, job + anchor, 1)
              p.write_text(text)
      - name: Run focused Google Play contract test
        working-directory: functions
        run: node --test test/googlePlayInternalTestingWorkflow.test.js
      - name: Run backend test suite
        working-directory: functions
        run: npm test
      - name: Commit patched workflow when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No workflow patch required.'
            exit 0
          fi
          git config user.name 'clickandsaveai-release-bot'
          git config user.email '64756523+vhanukaev1981@users.noreply.github.com'
          git add .github/workflows/production-release.yml
          git commit -m 'feat: publish production candidates to Play internal testing'
          git push origin HEAD:feat/google-play-internal-testing-wif
