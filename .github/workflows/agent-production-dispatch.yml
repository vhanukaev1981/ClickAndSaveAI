name: Owner Production Dispatch

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: read
  actions: write

jobs:
  dispatch-bounded-production-operation:
    if: ${{ github.event.issue.title == 'Agent Production Release' && (github.event.label.name == 'release:firebase-health' || github.event.label.name == 'release:production-staged') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_REPOSITORY: vhanukaev1981/ClickAndSaveAI
      EXPECTED_REPOSITORY_ID: '1314210715'
      EXPECTED_REPOSITORY_OWNER: vhanukaev1981
      EXPECTED_REPOSITORY_OWNER_ID: '64756523'
      EXPECTED_ISSUE_TITLE: Agent Production Release
      ISSUE_USER_LOGIN: ${{ github.event.issue.user.login }}
      ISSUE_USER_ID: ${{ github.event.issue.user.id }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      REQUEST_LABEL: ${{ github.event.label.name }}

    steps:
      - name: Guard repository and owner-only request identity
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ github.repository }}' == "$EXPECTED_REPOSITORY" ]] || { echo 'Repository identity mismatch.' >&2; exit 1; }
          [[ '${{ github.repository_id }}' == "$EXPECTED_REPOSITORY_ID" ]] || { echo 'Repository ID mismatch.' >&2; exit 1; }
          [[ '${{ github.repository_owner }}' == "$EXPECTED_REPOSITORY_OWNER" ]] || { echo 'Repository owner mismatch.' >&2; exit 1; }
          [[ '${{ github.repository_owner_id }}' == "$EXPECTED_REPOSITORY_OWNER_ID" ]] || { echo 'Repository owner ID mismatch.' >&2; exit 1; }
          [[ '${{ github.event.issue.user.login }}' == "$EXPECTED_REPOSITORY_OWNER" ]] || { echo 'Issue creator is not the repository owner.' >&2; exit 1; }
          [[ '${{ github.event.issue.user.id }}' == "$EXPECTED_REPOSITORY_OWNER_ID" ]] || { echo 'Issue creator ID is not the repository owner ID.' >&2; exit 1; }
          [[ "$ISSUE_USER_LOGIN" == "$EXPECTED_REPOSITORY_OWNER" && "$ISSUE_USER_ID" == "$EXPECTED_REPOSITORY_OWNER_ID" ]] || { echo 'Owner request identity mismatch.' >&2; exit 1; }
          [[ "$ISSUE_TITLE" == "$EXPECTED_ISSUE_TITLE" ]] || { echo 'Production request title mismatch.' >&2; exit 1; }

      - name: Parse bounded request and verify exact current main SHA
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          extract_one() {
            local key="$1"
            local values count
            values="$(printf '%s\n' "$ISSUE_BODY" | sed -n "s/^[[:space:]]*${key}[[:space:]]*:[[:space:]]*//p")"
            count="$(printf '%s\n' "$values" | sed '/^$/d' | wc -l | tr -d '[:space:]')"
            [[ "$count" == '1' ]] || { echo "Request must contain exactly one ${key}." >&2; exit 1; }
            printf '%s' "$values"
          }

          SOURCE_SHA="$(extract_one source_sha)"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'source_sha must be an exact lowercase 40-character commit SHA.' >&2; exit 1; }
          MAIN_SHA="$(gh api --method GET "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$SOURCE_SHA" == "$MAIN_SHA" ]] || { echo 'Requested source_sha is stale and does not equal refs/heads/main.' >&2; exit 1; }

          case "$REQUEST_LABEL" in
            release:firebase-health)
              OPERATION=release:firebase-health
              DEPLOYMENT_RUN_ID="$(extract_one deployment_run_id)"
              [[ "$DEPLOYMENT_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'deployment_run_id must be numeric.' >&2; exit 1; }
              echo "operation=firebase-health" >> "$GITHUB_OUTPUT"
              echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
              echo "deployment_run_id=$DEPLOYMENT_RUN_ID" >> "$GITHUB_OUTPUT"
              ;;
            release:production-staged)
              OPERATION=release:production-staged
              CANDIDATE_RUN_ID="$(extract_one candidate_run_id)"
              INTERNAL_TESTING_RUN_ID="$(extract_one internal_testing_run_id)"
              HEALTH_RUN_ID="$(extract_one health_run_id)"
              PRODUCTION_ROLLOUT_PERCENT="$(extract_one production_rollout_percent)"
              [[ "$CANDIDATE_RUN_ID" =~ ^[0-9]+$ && "$INTERNAL_TESTING_RUN_ID" =~ ^[0-9]+$ && "$HEALTH_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'Production evidence run IDs must be numeric.' >&2; exit 1; }
              [[ "$PRODUCTION_ROLLOUT_PERCENT" =~ ^(5|20|50|100)$ ]] || { echo 'production_rollout_percent is not an allowed stage.' >&2; exit 1; }
              echo "operation=production-staged" >> "$GITHUB_OUTPUT"
              echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
              echo "candidate_run_id=$CANDIDATE_RUN_ID" >> "$GITHUB_OUTPUT"
              echo "internal_testing_run_id=$INTERNAL_TESTING_RUN_ID" >> "$GITHUB_OUTPUT"
              echo "health_run_id=$HEALTH_RUN_ID" >> "$GITHUB_OUTPUT"
              echo "production_rollout_percent=$PRODUCTION_ROLLOUT_PERCENT" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo 'Unsupported production operation label.' >&2
              exit 1
              ;;
          esac
          echo "Validated bounded operation $OPERATION for exact main SHA $SOURCE_SHA."

      - name: Dispatch Firebase health controller only
        if: ${{ steps.request.outputs.operation == 'firebase-health' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          DEPLOYMENT_RUN_ID: ${{ steps.request.outputs.deployment_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "/repos/$GITHUB_REPOSITORY/actions/workflows/firebase-production-health-controller.yml/dispatches" \
            -f ref=main \
            -f "inputs[source_sha]=$SOURCE_SHA" \
            -f "inputs[deployment_run_id]=$DEPLOYMENT_RUN_ID" \
            -f 'inputs[authorize_firebase_health_check]=VERIFY_FIREBASE_PRODUCTION_HEALTH'

      - name: Dispatch staged Production controller only
        if: ${{ steps.request.outputs.operation == 'production-staged' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          CANDIDATE_RUN_ID: ${{ steps.request.outputs.candidate_run_id }}
          INTERNAL_TESTING_RUN_ID: ${{ steps.request.outputs.internal_testing_run_id }}
          HEALTH_RUN_ID: ${{ steps.request.outputs.health_run_id }}
          PRODUCTION_ROLLOUT_PERCENT: ${{ steps.request.outputs.production_rollout_percent }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "/repos/$GITHUB_REPOSITORY/actions/workflows/google-play-production-controller.yml/dispatches" \
            -f ref=main \
            -f "inputs[source_sha]=$SOURCE_SHA" \
            -f "inputs[candidate_run_id]=$CANDIDATE_RUN_ID" \
            -f "inputs[internal_testing_run_id]=$INTERNAL_TESTING_RUN_ID" \
            -f "inputs[health_run_id]=$HEALTH_RUN_ID" \
            -f 'inputs[authorize_google_play_production]=PUBLISH_GOOGLE_PLAY_PRODUCTION_STAGED' \
            -f "inputs[production_rollout_percent]=$PRODUCTION_ROLLOUT_PERCENT"
