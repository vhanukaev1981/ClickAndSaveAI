name: Task 3 Firebase Health Patch

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.pull_request.head.ref == 'feat/guarded-production-autonomy' && github.event.pull_request.user.login == github.repository_owner }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact feature head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Apply Task 3 Firebase health and evidence patch
        shell: python
        run: |
          from pathlib import Path
          path = Path('.github/workflows/production-release.yml')
          text = path.read_text()
          marker = '''          firebase deploy \\\n            --project "$PRODUCTION_FIREBASE_PROJECT_ID" \\\n            --only firestore:rules,firestore:indexes,functions \\\n            --non-interactive \\\n            --force\n'''
          addition = marker + '''\n      - name: Download exact candidate evidence for Firebase deployment audit\n        uses: actions/download-artifact@v4\n        with:\n          name: clickandsaveai-production-candidate-${{ env.SOURCE_SHA }}\n          path: ${{ runner.temp }}/firebase-production-evidence\n\n      - name: Collect post-deploy Firebase provider smoke telemetry\n        shell: bash\n        run: |\n          set -euo pipefail\n          FUNCTIONS_JSON="$RUNNER_TEMP/firebase-functions-list.json"\n          PROJECTS_JSON="$RUNNER_TEMP/firebase-projects-list.json"\n          TELEMETRY_JSON="$RUNNER_TEMP/firebase-production-health.json"\n          FIREBASE_INVENTORY_OK=false\n          SMOKE_OK=false\n\n          if firebase functions:list --project "$PRODUCTION_FIREBASE_PROJECT_ID" --json > "$FUNCTIONS_JSON" 2>/dev/null; then\n            if jq -e '(.result // .) | type == "array" and length > 0' "$FUNCTIONS_JSON" >/dev/null; then\n              FIREBASE_INVENTORY_OK=true\n            fi\n          fi\n\n          if firebase projects:list --json > "$PROJECTS_JSON" 2>/dev/null; then\n            if jq -e --arg project "$PRODUCTION_FIREBASE_PROJECT_ID" '(.result // .) | any((.projectId // .project_id // "") == $project)' "$PROJECTS_JSON" >/dev/null; then\n              SMOKE_OK=true\n            fi\n          fi\n\n          jq -n \\\n            --argjson firebase_inventory_ok "$FIREBASE_INVENTORY_OK" \\\n            --argjson smoke_ok "$SMOKE_OK" \\\n            '{firebase_inventory_ok:$firebase_inventory_ok,smoke_ok:$smoke_ok,telemetry_complete:($firebase_inventory_ok and $smoke_ok)}' \\\n            > "$TELEMETRY_JSON"\n\n          node scripts/production-health-gate.mjs config/production-release-policy.json "$TELEMETRY_JSON" firebase\n\n      - name: Record successful Firebase Production evidence\n        shell: bash\n        run: |\n          set -euo pipefail\n          IDENTITY="$RUNNER_TEMP/firebase-production-evidence/identity.txt"\n          [[ -f "$IDENTITY" ]] || { echo 'Production candidate identity evidence is missing.' >&2; exit 1; }\n          node scripts/production-release-evidence.mjs "$IDENTITY" firebase-deploy firebase-production success\n          grep -qx 'firebase_deployed=true' "$IDENTITY"\n          grep -qx 'google_play_published=false' "$IDENTITY"\n\n      - name: Upload Firebase Production deployment evidence\n        uses: actions/upload-artifact@v4\n        with:\n          name: clickandsaveai-firebase-production-evidence-${{ env.SOURCE_SHA }}\n          path: ${{ runner.temp }}/firebase-production-evidence/identity.txt\n          if-no-files-found: error\n          retention-days: 30\n'''
          if 'Collect post-deploy Firebase provider smoke telemetry' not in text:
              if marker not in text:
                  raise SystemExit('Firebase deploy marker not found; refusing patch')
              text = text.replace(marker, addition, 1)
          path.write_text(text)

      - name: Verify focused Task 3 contracts
        working-directory: functions
        run: node --test test/googlePlayInternalTestingWorkflow.test.js test/productionAutonomyWorkflow.test.js test/productionHealthGate.test.js test/productionReleaseEvidence.test.js

      - name: Create tested workflow blob only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          PATCHED_CONTENT="$(base64 -w0 .github/workflows/production-release.yml)"
          BLOB_SHA="$(jq -cn --arg content "$PATCHED_CONTENT" '{content:$content,encoding:"base64"}' | gh api --method POST "/repos/$GITHUB_REPOSITORY/git/blobs" --input - --jq '.sha')"
          [[ "$BLOB_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Blob creation failed.' >&2; exit 1; }
          printf '%s\n' "$BLOB_SHA" > "$RUNNER_TEMP/task3-blob-sha.txt"

      - name: Export tested blob SHA
        uses: actions/upload-artifact@v4
        with:
          name: task3-tested-blob
          path: ${{ runner.temp }}/task3-blob-sha.txt
          if-no-files-found: error
          retention-days: 1
